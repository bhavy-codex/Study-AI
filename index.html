<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Study-AI</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <!-- Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- PDF.js -->
  <script type="module">
    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs";

    window.pdfjsLib = pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.mjs";
  </script>

  <!-- Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    .message-content {
      line-height: 1.65;
    }

    .message-content p {
      margin: 0 0 10px;
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-content ul,
    .message-content ol {
      margin: 8px 0;
      padding-left: 22px;
    }

    .message-content code {
      background: rgba(127, 127, 127, 0.15);
      padding: 2px 5px;
      border-radius: 5px;
    }

    .message-content pre {
      overflow-x: auto;
      background: rgba(127, 127, 127, 0.12);
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3 {
      font-weight: 700;
      margin: 12px 0 6px;
    }

    .typing-dot {
      animation: blink 1.4s infinite both;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%,
      80%,
      100% {
        opacity: 0.25;
      }

      40% {
        opacity: 1;
      }
    }

    .mic-listening {
      animation: pulseMic 1.1s infinite;
    }

    @keyframes pulseMic {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }
    }

    .pdf-badge {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    textarea {
      resize: none;
    }

    .glass {
      backdrop-filter: blur(12px);
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white">

  <!-- APP -->
  <div class="min-h-screen flex flex-col">

    <!-- HEADER -->
    <header
      class="sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800
             bg-white/90 dark:bg-slate-950/90 glass"
    >
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">

        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-xl bg-indigo-600 text-white
                   flex items-center justify-center shadow"
          >
            <i class="fa-solid fa-graduation-cap"></i>
          </div>

          <div>
            <h1 class="font-bold text-lg">Study-AI</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">
              Your AI Study Assistant
            </p>
          </div>
        </div>

        <div class="flex items-center gap-2">

          <!-- New Chat -->
          <button
            id="newChatBtn"
            title="New Chat"
            class="w-10 h-10 rounded-xl border border-slate-200
                   dark:border-slate-700 hover:bg-slate-100
                   dark:hover:bg-slate-800 transition"
          >
            <i class="fa-solid fa-plus"></i>
          </button>

          <!-- Theme -->
          <button
            id="themeBtn"
            title="Toggle Theme"
            class="w-10 h-10 rounded-xl border border-slate-200
                   dark:border-slate-700 hover:bg-slate-100
                   dark:hover:bg-slate-800 transition"
          >
            <i id="themeIcon" class="fa-solid fa-moon"></i>
          </button>

        </div>
      </div>
    </header>


    <!-- MAIN -->
    <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-6">

      <!-- WELCOME -->
      <section id="welcomeSection" class="py-8">

        <div class="text-center max-w-2xl mx-auto">

          <div
            class="w-16 h-16 mx-auto rounded-2xl bg-indigo-600
                   text-white flex items-center justify-center
                   text-2xl shadow-lg mb-5"
          >
            <i class="fa-solid fa-brain"></i>
          </div>

          <h2 class="text-3xl sm:text-4xl font-bold mb-3">
            What do you want to learn?
          </h2>

          <p class="text-slate-500 dark:text-slate-400">
            Ask questions, upload PDFs, or speak to your AI study assistant.
          </p>

        </div>


        <!-- QUICK ACTIONS -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-3xl mx-auto mt-8">

          <button
            class="quick-btn p-4 rounded-2xl border border-slate-200
                   dark:border-slate-800 bg-white dark:bg-slate-900
                   hover:border-indigo-400 transition text-left"
            data-prompt="Explain this topic in very simple words."
          >
            <i class="fa-solid fa-lightbulb text-amber-500 mb-2"></i>
            <div class="font-semibold text-sm">Explain</div>
            <div class="text-xs text-slate-500 mt-1">Simple explanation</div>
          </button>

          <button
            class="quick-btn p-4 rounded-2xl border border-slate-200
                   dark:border-slate-800 bg-white dark:bg-slate-900
                   hover:border-indigo-400 transition text-left"
            data-prompt="Solve this question step by step."
          >
            <i class="fa-solid fa-calculator text-blue-500 mb-2"></i>
            <div class="font-semibold text-sm">Solve</div>
            <div class="text-xs text-slate-500 mt-1">Step-by-step</div>
          </button>

          <button
            class="quick-btn p-4 rounded-2xl border border-slate-200
                   dark:border-slate-800 bg-white dark:bg-slate-900
                   hover:border-indigo-400 transition text-left"
            data-prompt="Create a short quiz about this topic."
          >
            <i class="fa-solid fa-list-check text-green-500 mb-2"></i>
            <div class="font-semibold text-sm">Quiz</div>
            <div class="text-xs text-slate-500 mt-1">Test yourself</div>
          </button>

          <!-- VOICE QUICK ACTION -->
          <button
            id="welcomeVoiceBtn"
            class="p-4 rounded-2xl border border-slate-200
                   dark:border-slate-800 bg-white dark:bg-slate-900
                   hover:border-indigo-400 transition text-left"
          >
            <i class="fa-solid fa-microphone text-red-500 mb-2"></i>
            <div class="font-semibold text-sm">Voice</div>
            <div class="text-xs text-slate-500 mt-1">
              Ask by speaking
            </div>
          </button>

        </div>


        <!-- PDF WELCOME UPLOAD -->
        <div class="max-w-3xl mx-auto mt-6">

          <label
            for="pdfInput"
            class="cursor-pointer flex items-center justify-center gap-3
                   p-5 rounded-2xl border-2 border-dashed
                   border-slate-300 dark:border-slate-700
                   hover:border-indigo-500 transition
                   bg-white dark:bg-slate-900"
          >
            <i class="fa-solid fa-file-pdf text-red-500 text-xl"></i>

            <div>
              <div class="font-semibold">
                Upload a PDF
              </div>

              <div class="text-xs text-slate-500 dark:text-slate-400">
                Text PDFs and scanned PDFs supported with OCR
              </div>
            </div>
          </label>

        </div>

      </section>


      <!-- CHAT -->
      <section
        id="chatSection"
        class="hidden"
      >

        <div
          id="messages"
          class="space-y-5 pb-32"
        ></div>

      </section>

    </main>


    <!-- PDF STATUS -->
    <div
      id="pdfStatus"
      class="hidden fixed bottom-24 left-4 right-4 z-40"
    >
      <div
        class="max-w-5xl mx-auto bg-white dark:bg-slate-900
               border border-slate-200 dark:border-slate-700
               rounded-xl shadow-lg p-3 flex items-center gap-3"
      >
        <i class="fa-solid fa-file-pdf text-red-500"></i>

        <div class="min-w-0 flex-1">
          <div
            id="pdfStatusText"
            class="text-sm font-medium truncate"
          >
            Processing PDF...
          </div>

          <div
            id="pdfProgress"
            class="text-xs text-slate-500 mt-1"
          ></div>
        </div>

        <button
          id="removePdfBtn"
          class="w-8 h-8 rounded-lg hover:bg-slate-100
                 dark:hover:bg-slate-800"
          title="Remove PDF"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>


    <!-- INPUT AREA -->
    <footer
      class="sticky bottom-0 z-40 border-t border-slate-200
             dark:border-slate-800 bg-white/95 dark:bg-slate-950/95 glass"
    >

      <div class="max-w-5xl mx-auto px-4 py-3">

        <!-- PDF READY BADGE -->
        <div
          id="pdfReadyBadge"
          class="hidden mb-2"
        >
          <div
            class="inline-flex items-center gap-2 px-3 py-1.5
                   rounded-full bg-red-50 dark:bg-red-950/30
                   text-red-600 dark:text-red-400 text-xs font-medium"
          >
            <i class="fa-solid fa-file-pdf"></i>
            <span id="pdfFileName" class="pdf-badge">
              PDF ready
            </span>
          </div>
        </div>


        <!-- INPUT BOX -->
        <div
          class="rounded-2xl border border-slate-300
                 dark:border-slate-700 bg-slate-50
                 dark:bg-slate-900 shadow-sm"
        >

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Ask Study-AI anything..."
            class="w-full bg-transparent outline-none
                   px-4 pt-4 pb-2 text-sm sm:text-base"
          ></textarea>


          <!-- TOOLBAR -->
          <div
            class="px-3 pb-3 flex items-center justify-between gap-2"
          >

            <div class="flex items-center gap-1">

              <!-- PDF -->
              <label
                for="pdfInput"
                title="Upload PDF"
                class="w-9 h-9 rounded-xl flex items-center
                       justify-center cursor-pointer
                       hover:bg-slate-200 dark:hover:bg-slate-800
                       transition"
              >
                <i class="fa-solid fa-paperclip"></i>
              </label>

              <!-- Hidden input -->
              <input
                id="pdfInput"
                type="file"
                accept="application/pdf,.pdf"
                class="hidden"
              />


              <!-- Math -->
              <button
                id="mathBtn"
                title="Math"
                class="w-9 h-9 rounded-xl hover:bg-slate-200
                       dark:hover:bg-slate-800 transition"
              >
                <i class="fa-solid fa-square-root-variable"></i>
              </button>


              <!-- Explain -->
              <button
                id="explainBtn"
                title="Explain"
                class="w-9 h-9 rounded-xl hover:bg-slate-200
                       dark:hover:bg-slate-800 transition"
              >
                <i class="fa-solid fa-lightbulb"></i>
              </button>


              <!-- Solve -->
              <button
                id="solveBtn"
                title="Solve"
                class="w-9 h-9 rounded-xl hover:bg-slate-200
                       dark:hover:bg-slate-800 transition"
              >
                <i class="fa-solid fa-check"></i>
              </button>

            </div>


            <div class="flex items-center gap-2">

              <!-- STOP SPEAKING -->
              <button
                id="stopVoiceBtn"
                title="Stop AI voice"
                class="hidden w-10 h-10 rounded-xl
                       bg-slate-200 dark:bg-slate-800
                       hover:bg-slate-300 dark:hover:bg-slate-700"
              >
                <i class="fa-solid fa-stop"></i>
              </button>


              <!-- MIC -->
              <button
                id="micBtn"
                title="Voice input"
                class="w-10 h-10 rounded-xl
                       bg-slate-200 dark:bg-slate-800
                       hover:bg-slate-300 dark:hover:bg-slate-700
                       transition"
              >
                <i id="micIcon" class="fa-solid fa-microphone"></i>
              </button>


              <!-- SEND -->
              <button
                id="sendBtn"
                title="Send"
                class="w-10 h-10 rounded-xl bg-indigo-600
                       text-white hover:bg-indigo-700 transition"
              >
                <i class="fa-solid fa-paper-plane"></i>
              </button>

            </div>

          </div>

        </div>


        <!-- VOICE STATUS -->
        <div
          id="voiceStatus"
          class="hidden text-center text-xs text-slate-500
                 dark:text-slate-400 mt-2"
        >
          <i class="fa-solid fa-microphone mr-1"></i>
          Listening...
        </div>


        <div
          class="text-center text-[11px] text-slate-400 mt-2"
        >
          Study-AI can make mistakes. Check important answers.
        </div>

      </div>

    </footer>

  </div>


  <script>
    /* =========================================================
       STUDY-AI
       CHAT + MEMORY + PDF + OCR + VOICE
       ========================================================= */


    /* ---------------------------------------------------------
       ELEMENTS
       --------------------------------------------------------- */

    const welcomeSection = document.getElementById("welcomeSection");
    const chatSection = document.getElementById("chatSection");
    const messages = document.getElementById("messages");

    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    const newChatBtn = document.getElementById("newChatBtn");

    const themeBtn = document.getElementById("themeBtn");
    const themeIcon = document.getElementById("themeIcon");

    const pdfInput = document.getElementById("pdfInput");
    const pdfStatus = document.getElementById("pdfStatus");
    const pdfStatusText = document.getElementById("pdfStatusText");
    const pdfProgress = document.getElementById("pdfProgress");

    const pdfReadyBadge = document.getElementById("pdfReadyBadge");
    const pdfFileName = document.getElementById("pdfFileName");
    const removePdfBtn = document.getElementById("removePdfBtn");

    const micBtn = document.getElementById("micBtn");
    const micIcon = document.getElementById("micIcon");
    const voiceStatus = document.getElementById("voiceStatus");

    const welcomeVoiceBtn =
      document.getElementById("welcomeVoiceBtn");

    const stopVoiceBtn =
      document.getElementById("stopVoiceBtn");


    /* ---------------------------------------------------------
       CHAT MEMORY
       --------------------------------------------------------- */

    let chatHistory = [];

    let isSending = false;


    /* ---------------------------------------------------------
       PDF STATE
       --------------------------------------------------------- */

    let pdfText = "";
    let uploadedPdfFileName = "";
    let pdfReady = false;


    /* ---------------------------------------------------------
       THEME
       --------------------------------------------------------- */

    const savedTheme =
      localStorage.getItem("theme");

    if (savedTheme === "dark") {
      document.documentElement.classList.add("dark");
    }

    function updateThemeIcon() {
      const isDark =
        document.documentElement.classList.contains("dark");

      themeIcon.className = isDark
        ? "fa-solid fa-sun"
        : "fa-solid fa-moon";
    }

    updateThemeIcon();


    themeBtn.addEventListener("click", () => {

      document.documentElement.classList.toggle("dark");

      const isDark =
        document.documentElement.classList.contains("dark");

      localStorage.setItem(
        "theme",
        isDark ? "dark" : "light"
      );

      updateThemeIcon();
    });


    /* ---------------------------------------------------------
       HELPERS
       --------------------------------------------------------- */

    function showChat() {
      welcomeSection.classList.add("hidden");
      chatSection.classList.remove("hidden");
    }


    function scrollToBottom() {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }


    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }


    /* ---------------------------------------------------------
       ADD USER MESSAGE
       --------------------------------------------------------- */

    function addUserMessage(text) {

      showChat();

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "flex justify-end";

      wrapper.innerHTML = `
        <div class="max-w-[85%] sm:max-w-[75%]">
          <div
            class="rounded-2xl rounded-br-md
                   bg-indigo-600 text-white
                   px-4 py-3 shadow-sm"
          >
            <div class="message-content">
              ${escapeHtml(text).replace(/\n/g, "<br>")}
            </div>
          </div>
        </div>
      `;

      messages.appendChild(wrapper);

      scrollToBottom();
    }


    /* ---------------------------------------------------------
       ADD AI MESSAGE
       --------------------------------------------------------- */

    function addAIMessage(text) {

      showChat();

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "flex justify-start";

      const messageId =
        "ai-" + Date.now();

      wrapper.innerHTML = `
        <div class="max-w-[90%] sm:max-w-[80%]">

          <div class="flex items-start gap-3">

            <div
              class="w-8 h-8 shrink-0 rounded-lg
                     bg-indigo-600 text-white
                     flex items-center justify-center"
            >
              <i class="fa-solid fa-brain text-xs"></i>
            </div>

            <div
              class="rounded-2xl rounded-bl-md
                     bg-white dark:bg-slate-900
                     border border-slate-200
                     dark:border-slate-800
                     px-4 py-3 shadow-sm"
            >

              <div
                id="${messageId}"
                class="message-content text-sm sm:text-base"
              ></div>

              <div class="mt-3 flex items-center gap-2">

                <button
                  class="speak-answer-btn text-xs
                         text-slate-500 hover:text-indigo-600
                         dark:hover:text-indigo-400"
                  data-text=""
                  title="Read answer aloud"
                >
                  <i class="fa-solid fa-volume-high mr-1"></i>
                  Listen
                </button>

                <button
                  class="copy-answer-btn text-xs
                         text-slate-500 hover:text-indigo-600
                         dark:hover:text-indigo-400"
                  data-text=""
                  title="Copy answer"
                >
                  <i class="fa-regular fa-copy mr-1"></i>
                  Copy
                </button>

              </div>

            </div>

          </div>

        </div>
      `;

      messages.appendChild(wrapper);

      const content =
        wrapper.querySelector(`#${messageId}`);

      /*
        Marked renders the AI markdown.
      */
      content.innerHTML = marked.parse(text);

      const speakButton =
        wrapper.querySelector(".speak-answer-btn");

      speakButton.dataset.text = text;

      const copyButton =
        wrapper.querySelector(".copy-answer-btn");

      copyButton.dataset.text = text;

      speakButton.addEventListener("click", () => {
        speakText(text);
      });

      copyButton.addEventListener("click", async () => {

        try {
          await navigator.clipboard.writeText(text);

          copyButton.innerHTML =
            '<i class="fa-solid fa-check mr-1"></i>Copied';

          setTimeout(() => {
            copyButton.innerHTML =
              '<i class="fa-regular fa-copy mr-1"></i>Copy';
          }, 1500);

        } catch (error) {
          console.error(error);
        }

      });

      scrollToBottom();
    }


    /* ---------------------------------------------------------
       TYPING MESSAGE
       --------------------------------------------------------- */

    function addTypingMessage() {

      const wrapper =
        document.createElement("div");

      wrapper.id = "typingMessage";

      wrapper.className =
        "flex justify-start";

      wrapper.innerHTML = `
        <div class="max-w-[90%]">

          <div class="flex items-start gap-3">

            <div
              class="w-8 h-8 rounded-lg bg-indigo-600
                     text-white flex items-center
                     justify-center shrink-0"
            >
              <i class="fa-solid fa-brain text-xs"></i>
            </div>

            <div
              class="rounded-2xl rounded-bl-md
                     bg-white dark:bg-slate-900
                     border border-slate-200
                     dark:border-slate-800
                     px-4 py-3"
            >

              <div class="flex gap-1">
                <span class="typing-dot">●</span>
                <span class="typing-dot">●</span>
                <span class="typing-dot">●</span>
              </div>

            </div>

          </div>

        </div>
      `;

      messages.appendChild(wrapper);

      scrollToBottom();
    }


    function removeTypingMessage() {

      const typing =
        document.getElementById("typingMessage");

      if (typing) {
        typing.remove();
      }
    }


    /* ---------------------------------------------------------
       SEND MESSAGE
       --------------------------------------------------------- */

    async function sendMessage(customMessage = null) {

      if (isSending) return;

      const text =
        customMessage !== null
          ? customMessage.trim()
          : messageInput.value.trim();

      if (!text) return;


      isSending = true;

      messageInput.value = "";

      autoResizeTextarea();

      addUserMessage(text);

      addTypingMessage();


      try {

        const response =
          await fetch("/api/chat", {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              message: text,

              history: chatHistory,

              pdfText: pdfText,

              pdfFileName: uploadedPdfFileName

            })
          });


        const data =
          await response.json();


        removeTypingMessage();


        if (!response.ok) {

          throw new Error(
            data?.error ||
            "Something went wrong."
          );
        }


        const answer =
          data?.answer || "No answer received.";


        /*
          Save memory.
        */

        chatHistory.push({
          role: "user",
          parts: [
            {
              text
            }
          ]
        });


        chatHistory.push({
          role: "model",
          parts: [
            {
              text: answer
            }
          ]
        });


        /*
          Keep browser memory manageable.
        */

        if (chatHistory.length > 12) {
          chatHistory =
            chatHistory.slice(-12);
        }


        addAIMessage(answer);


        /*
          Automatically read the AI response
          when the user used the microphone.
        */

        if (lastInputWasVoice) {

          speakText(answer);

          lastInputWasVoice = false;
        }

      } catch (error) {

        removeTypingMessage();

        addAIMessage(
          "Sorry, I couldn't get an answer right now.\n\n" +
          error.message
        );

      } finally {

        isSending = false;

      }
    }


    /* ---------------------------------------------------------
       SEND BUTTON
       --------------------------------------------------------- */

    sendBtn.addEventListener("click", () => {
      lastInputWasVoice = false;
      sendMessage();
    });


    /* ---------------------------------------------------------
       ENTER TO SEND
       --------------------------------------------------------- */

    messageInput.addEventListener("keydown", (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        lastInputWasVoice = false;

        sendMessage();
      }

    });


    /* ---------------------------------------------------------
       AUTO RESIZE TEXTAREA
       --------------------------------------------------------- */

    function autoResizeTextarea() {

      messageInput.style.height = "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          160
        ) + "px";
    }


    messageInput.addEventListener(
      "input",
      autoResizeTextarea
    );


    /* ---------------------------------------------------------
       QUICK BUTTONS
       --------------------------------------------------------- */

    document.querySelectorAll(".quick-btn")
      .forEach(button => {

        button.addEventListener("click", () => {

          const prompt =
            button.dataset.prompt || "";

          messageInput.value = prompt;

          messageInput.focus();

          autoResizeTextarea();
        });

      });


    /* ---------------------------------------------------------
       MATH / EXPLAIN / SOLVE
       --------------------------------------------------------- */

    document.getElementById("mathBtn")
      .addEventListener("click", () => {

        messageInput.value =
          "Solve this math problem step by step: ";

        messageInput.focus();

        autoResizeTextarea();
      });


    document.getElementById("explainBtn")
      .addEventListener("click", () => {

        messageInput.value =
          "Explain this in very simple words: ";

        messageInput.focus();

        autoResizeTextarea();
      });


    document.getElementById("solveBtn")
      .addEventListener("click", () => {

        messageInput.value =
          "Solve this question step by step: ";

        messageInput.focus();

        autoResizeTextarea();
      });


    /* =========================================================
       🎙️ VOICE INPUT
       ========================================================= */


    let recognition = null;

    let isListening = false;

    let lastInputWasVoice = false;


    /*
      Browser support.

      Chrome / Edge / Android Chrome usually expose
      SpeechRecognition as webkitSpeechRecognition.
    */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();

      recognition.continuous = false;

      recognition.interimResults = true;

      recognition.lang = "en-IN";


      recognition.onstart = () => {

        isListening = true;

        micBtn.classList.add(
          "bg-red-500",
          "text-white",
          "mic-listening"
        );

        micIcon.className =
          "fa-solid fa-microphone";

        voiceStatus.classList.remove(
          "hidden"
        );

        voiceStatus.innerHTML =
          '<i class="fa-solid fa-microphone mr-1"></i> Listening...';

      };


      recognition.onresult = (event) => {

        let finalTranscript = "";

        let interimTranscript = "";


        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const transcript =
            event.results[i][0].transcript;


          if (
            event.results[i].isFinal
          ) {

            finalTranscript += transcript;

          } else {

            interimTranscript += transcript;

          }

        }


        if (finalTranscript) {

          messageInput.value =
            finalTranscript;

          autoResizeTextarea();

          lastInputWasVoice = true;

          /*
            Automatically send after speech.
          */

          setTimeout(() => {

            if (
              messageInput.value.trim()
            ) {
              sendMessage();
            }

          }, 300);

        } else if (interimTranscript) {

          messageInput.value =
            interimTranscript;

          autoResizeTextarea();
        }

      };


      recognition.onerror = (event) => {

        console.error(
          "Speech recognition error:",
          event.error
        );

        isListening = false;

        resetMicUI();

        if (
          event.error === "not-allowed"
        ) {

          voiceStatus.classList.remove(
            "hidden"
          );

          voiceStatus.textContent =
            "Microphone permission was denied.";

        }

      };


      recognition.onend = () => {

        isListening = false;

        resetMicUI();

      };

    } else {

      /*
        Browser doesn't support speech recognition.
      */

      micBtn.title =
        "Voice input is not supported in this browser";

      welcomeVoiceBtn.disabled = true;

      welcomeVoiceBtn.classList.add(
        "opacity-50",
        "cursor-not-allowed"
      );

    }


    function resetMicUI() {

      micBtn.classList.remove(
        "bg-red-500",
        "text-white",
        "mic-listening"
      );

      micIcon.className =
        "fa-solid fa-microphone";

      voiceStatus.classList.add(
        "hidden"
      );
    }


    function toggleVoiceInput() {

      if (!recognition) {

        alert(
          "Voice input is not supported in this browser. Try Chrome."
        );

        return;
      }


      if (isListening) {

        recognition.stop();

      } else {

        try {

          /*
            You can change this to:
            "gu-IN" for Gujarati
            "hi-IN" for Hindi
            "en-IN" for English
          */

          recognition.lang = "en-IN";

          recognition.start();

        } catch (error) {

          console.error(error);

        }

      }
    }


    micBtn.addEventListener(
      "click",
      toggleVoiceInput
    );


    welcomeVoiceBtn.addEventListener(
      "click",
      () => {

        showChat();

        toggleVoiceInput();

      }
    );


    /* =========================================================
       🔊 AI VOICE OUTPUT
       ========================================================= */


    function cleanTextForSpeech(text) {

      /*
        Remove markdown before speech.
      */

      return text
        .replace(/```[\s\S]*?```/g, " code block ")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/[#*_~]/g, "")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .replace(/\s+/g, " ")
        .trim();
    }


    function speakText(text) {

      if (
        !("speechSynthesis" in window)
      ) {

        alert(
          "Voice output is not supported in this browser."
        );

        return;
      }


      speechSynthesis.cancel();


      const cleanText =
        cleanTextForSpeech(text);


      if (!cleanText) return;


      const utterance =
        new SpeechSynthesisUtterance(
          cleanText
        );


      /*
        Indian English voice preference.
      */

      const voices =
        speechSynthesis.getVoices();


      const preferredVoice =
        voices.find(voice =>
          voice.lang === "en-IN"
        ) ||
        voices.find(voice =>
          voice.lang.startsWith("en-IN")
        ) ||
        voices.find(voice =>
          voice.lang.startsWith("en")
        );


      if (preferredVoice) {
        utterance.voice =
          preferredVoice;
      }


      utterance.rate = 0.95;

      utterance.pitch = 1;

      utterance.volume = 1;


      utterance.onstart = () => {

        stopVoiceBtn.classList.remove(
          "hidden"
        );

      };


      utterance.onend = () => {

        stopVoiceBtn.classList.add(
          "hidden"
        );

      };


      utterance.onerror = () => {

        stopVoiceBtn.classList.add(
          "hidden"
        );

      };


      speechSynthesis.speak(
        utterance
      );
    }


    stopVoiceBtn.addEventListener(
      "click",
      () => {

        speechSynthesis.cancel();

        stopVoiceBtn.classList.add(
          "hidden"
        );

      }
    );


    /*
      Some mobile browsers load voices
      asynchronously.
    */

    if (
      "speechSynthesis" in window
    ) {

      speechSynthesis.onvoiceschanged =
        () => {
          speechSynthesis.getVoices();
        };

    }


    /* =========================================================
       📄 PDF UPLOAD
       ========================================================= */

    pdfInput.addEventListener(
      "change",
      async (event) => {

        const file =
          event.target.files?.[0];

        if (!file) return;


        if (
          file.type !==
          "application/pdf"
        ) {

          alert(
            "Please select a PDF file."
          );

          pdfInput.value = "";

          return;
        }


        /*
          20 MB maximum.
        */

        const maxSize =
          20 * 1024 * 1024;


        if (file.size > maxSize) {

          alert(
            "PDF is too large. Maximum size is 20 MB."
          );

          pdfInput.value = "";

          return;
        }


        uploadedPdfFileName =
          file.name;

        pdfText = "";

        pdfReady = false;


        pdfStatus.classList.remove(
          "hidden"
        );

        pdfStatusText.textContent =
          "Reading " + file.name;

        pdfProgress.textContent =
          "Extracting PDF text...";


        try {

          await processPDF(file);

        } catch (error) {

          console.error(
            "PDF processing error:",
            error
          );

          pdfStatusText.textContent =
            "PDF processing failed.";

          pdfProgress.textContent =
            error.message ||
            "Unable to read this PDF.";

          setTimeout(() => {
            pdfStatus.classList.add(
              "hidden"
            );
          }, 4000);

        }

      }
    );


    /* ---------------------------------------------------------
       PROCESS PDF
       --------------------------------------------------------- */

    async function processPDF(file) {

      const arrayBuffer =
        await file.arrayBuffer();


      const pdf =
        await window.pdfjsLib
          .getDocument({
            data: arrayBuffer
          })
          .promise;


      let extractedText = "";


      /*
        First attempt:
        normal selectable PDF text.
      */

      for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ) {

        pdfProgress.textContent =
          `Reading page ${pageNumber} of ${pdf.numPages}...`;


        const page =
          await pdf.getPage(
            pageNumber
          );


        const content =
          await page.getTextContent();


        const pageText =
          content.items
            .map(item =>
              item.str || ""
            )
            .join(" ");


        extractedText +=
          pageText + "\n\n";
      }


      /*
        If enough text exists,
        use normal extraction.
      */

      if (
        extractedText.trim().length >= 100
      ) {

        pdfText =
          extractedText.trim();

        pdfReady = true;

        showPDFReady(
          `PDF ready — ${pdf.numPages} page(s)`
        );

        return;
      }


      /*
        Otherwise:
        scanned/image PDF → OCR
      */

      pdfStatusText.textContent =
        "Scanned PDF detected";

      pdfProgress.textContent =
        "Starting OCR...";


      let ocrText = "";


      for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ) {

        pdfStatusText.textContent =
          `OCR page ${pageNumber} of ${pdf.numPages}`;


        pdfProgress.textContent =
          "Reading scanned page...";


        const page =
          await pdf.getPage(
            pageNumber
          );


        const viewport =
          page.getViewport({
            scale: 1.5
          });


        const canvas =
          document.createElement(
            "canvas"
          );


        const context =
          canvas.getContext(
            "2d"
          );


        canvas.width =
          viewport.width;

        canvas.height =
          viewport.height;


        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;


        const result =
          await Tesseract.recognize(
            canvas,
            "eng",
            {
              logger: info => {

                if (
                  info.status
                ) {

                  pdfProgress.textContent =
                    `${info.status} ${
                      info.progress
                        ? Math.round(
                            info.progress * 100
                          ) + "%"
                        : ""
                    }`;

                }

              }
            }
          );


        ocrText +=
          result.data.text +
          "\n\n";
      }


      if (
        ocrText.trim().length < 20
      ) {

        throw new Error(
          "No readable text was found in this PDF."
        );

      }


      pdfText =
        ocrText.trim();

      pdfReady = true;


      showPDFReady(
        `PDF + OCR ready — ${pdf.numPages} page(s)`
      );

    }


    /* ---------------------------------------------------------
       PDF READY
       --------------------------------------------------------- */

    function showPDFReady(status) {

      pdfStatusText.textContent =
        status;

      pdfProgress.textContent =
        "Study-AI will use this PDF for your questions.";


      pdfReadyBadge.classList.remove(
        "hidden"
      );


      pdfFileName.textContent =
        uploadedPdfFileName;


      setTimeout(() => {

        pdfStatus.classList.add(
          "hidden"
        );

      }, 2500);


      /*
        Move to chat.
      */

      showChat();

      scrollToBottom();
    }


    /* ---------------------------------------------------------
       REMOVE PDF
       --------------------------------------------------------- */

    removePdfBtn.addEventListener(
      "click",
      () => {

        pdfText = "";

        uploadedPdfFileName = "";

        pdfReady = false;

        pdfInput.value = "";

        pdfReadyBadge.classList.add(
          "hidden"
        );

        pdfStatus.classList.add(
          "hidden"
        );

      }
    );


    /* =========================================================
       🆕 NEW CHAT
       ========================================================= */

    newChatBtn.addEventListener(
      "click",
      () => {

        /*
          Stop voice.
        */

        if (
          "speechSynthesis" in window
        ) {
          speechSynthesis.cancel();
        }


        if (
          recognition &&
          isListening
        ) {
          recognition.stop();
        }


        /*
          Clear memory.
        */

        chatHistory = [];


        /*
          Clear PDF.
        */

        pdfText = "";

        uploadedPdfFileName = "";

        pdfReady = false;

        pdfInput.value = "";


        /*
          Clear UI.
        */

        messages.innerHTML = "";

        messageInput.value = "";

        autoResizeTextarea();

        pdfReadyBadge.classList.add(
          "hidden"
        );

        pdfStatus.classList.add(
          "hidden"
        );


        /*
          Return to welcome screen.
        */

        chatSection.classList.add(
          "hidden"
        );

        welcomeSection.classList.remove(
          "hidden"
        );

      }
    );


    /* =========================================================
       INITIAL STATE
       ========================================================= */

    autoResizeTextarea();

  </script>

</body>
</html>
