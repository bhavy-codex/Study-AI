<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study-AI Chat</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
    darkMode: "class"
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Inter", sans-serif;
    transition: background-color .25s, color .25s;
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-thumb {
    background: #c7c7c7;
    border-radius: 20px;
}

.chat-message {
    animation: messageIn .2s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.ai-content p {
    margin: 0 0 10px;
}

.ai-content p:last-child {
    margin-bottom: 0;
}

.ai-content ul,
.ai-content ol {
    margin: 8px 0;
    padding-left: 22px;
}

.ai-content li {
    margin: 5px 0;
}

.ai-content strong {
    font-weight: 700;
}

.ai-content code {
    background: #f1f1f1;
    padding: 2px 5px;
    border-radius: 5px;
}

.dark .ai-content code {
    background: #292d33;
}

.ai-content pre {
    background: #111;
    color: white;
    padding: 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 10px 0;
}

.thinking-dot {
    animation: thinking 1.2s infinite;
}

.thinking-dot:nth-child(2) {
    animation-delay: .15s;
}

.thinking-dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes thinking {
    0%, 60%, 100% {
        opacity: .3;
    }

    30% {
        opacity: 1;
    }
}
</style>
</head>


<body class="bg-[#f8f8f8] dark:bg-[#0d0f12] text-gray-900 dark:text-gray-100 min-h-screen">


<!-- =========================
     TOP BAR
========================= -->

<header class="h-14 border-b border-gray-200 dark:border-gray-800 bg-white/90 dark:bg-[#0d0f12]/90 backdrop-blur-md sticky top-0 z-50">

    <div class="max-w-4xl mx-auto h-full px-4 flex items-center justify-between">

        <div class="flex items-center gap-2">

            <div class="w-8 h-8 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center font-bold">
                S
            </div>

            <span class="font-bold">
                Study-AI
            </span>

        </div>


        <div class="flex items-center gap-2">

            <!-- NEW CHAT -->

            <button
                onclick="clearChat()"
                class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center"
                title="New chat">

                <i class="fa-solid fa-plus text-xs"></i>

            </button>


            <!-- DARK MODE -->

            <button
                onclick="toggleDarkMode()"
                class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center"
                title="Toggle dark mode">

                <i id="themeIcon" class="fa-regular fa-moon text-sm"></i>

            </button>

        </div>

    </div>

</header>



<!-- =========================
     CHAT AREA
========================= -->

<main class="max-w-3xl mx-auto px-4 min-h-[calc(100vh-56px)] flex flex-col">


    <!-- =========================
         WELCOME
    ========================= -->

    <div
        id="welcome"
        class="flex-1 flex flex-col items-center justify-center text-center pb-32">

        <div class="w-12 h-12 rounded-2xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center mb-5 shadow-sm">

            <i class="fa-solid fa-star"></i>

        </div>


        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-3">

            What do you want to learn?

        </h1>


        <p class="text-sm text-gray-500 dark:text-gray-400">

            Ask Study-AI anything about your studies.

        </p>

    </div>



    <!-- =========================
         MESSAGES
    ========================= -->

    <div
        id="messages"
        class="flex-1 py-6 space-y-6 hidden">

    </div>



    <!-- =========================
         INPUT
    ========================= -->

    <div class="sticky bottom-0 pb-5 pt-3 bg-gradient-to-t from-[#f8f8f8] dark:from-[#0d0f12] via-[#f8f8f8] dark:via-[#0d0f12] to-transparent">


        <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 rounded-2xl shadow-sm overflow-hidden">


            <textarea
                id="userPrompt"
                rows="2"
                placeholder="Message Study-AI..."
                class="w-full px-4 pt-4 pb-2 bg-transparent outline-none resize-none text-sm placeholder-gray-400 dark:placeholder-gray-500"
                onkeydown="handleKeyDown(event)">
            </textarea>


            <div class="flex items-center justify-between px-3 pb-3 pt-1">


                <div class="flex items-center gap-2">


                    <!-- MATH -->

                    <button
                        onclick="insertMath()"
                        class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"
                        title="Math equation">

                        <i class="fa-solid fa-calculator text-xs"></i>

                    </button>


                    <!-- EXPLAIN -->

                    <button
                        onclick="quickQuestion('Explain this topic in simple words.')"
                        class="hidden sm:block px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs hover:bg-gray-200 dark:hover:bg-gray-700">

                        Explain

                    </button>


                    <!-- SOLVE -->

                    <button
                        onclick="quickQuestion('Solve this step-by-step and explain the answer.')"
                        class="hidden sm:block px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs hover:bg-gray-200 dark:hover:bg-gray-700">

                        Solve

                    </button>

                </div>


                <!-- SEND -->

                <button
                    id="sendButton"
                    onclick="sendMessage()"
                    class="w-9 h-9 rounded-xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center hover:opacity-80 disabled:opacity-40">

                    <i class="fa-solid fa-arrow-up text-xs"></i>

                </button>

            </div>

        </div>


        <p class="text-center text-[10px] text-gray-400 mt-2">

            Study-AI can make mistakes. Check important answers.

        </p>

    </div>

</main>



<script>

/* =========================
   CHAT MEMORY
========================= */

let chatHistory = [];


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

    document.documentElement.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.documentElement.classList.contains("dark")
            ? "dark"
            : "light"
    );

    updateThemeIcon();
}


function updateThemeIcon() {

    const icon = document.getElementById("themeIcon");

    if (!icon) return;

    if (
        document.documentElement.classList.contains("dark")
    ) {

        icon.className =
            "fa-regular fa-sun text-sm";

    } else {

        icon.className =
            "fa-regular fa-moon text-sm";
    }
}


/* LOAD THEME */

if (
    localStorage.getItem("theme") === "dark"
) {

    document.documentElement.classList.add("dark");

}

updateThemeIcon();



/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

}



/* =========================
   ENTER KEY
========================= */

function handleKeyDown(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}



/* =========================
   QUICK QUESTION
========================= */

function quickQuestion(text) {

    const input =
        document.getElementById("userPrompt");

    input.value = text;

    input.focus();

}



/* =========================
   MATH BUTTON
========================= */

function insertMath() {

    const input =
        document.getElementById("userPrompt");

    input.value =
        "Solve this equation step-by-step: 2x² + 5x - 3 = 0";

    input.focus();

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}



/* =========================
   USER MESSAGE
========================= */

function addUserMessage(text) {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "chat-message flex justify-end";

    message.innerHTML = `

        <div class="max-w-[85%]">

            <div class="bg-black dark:bg-white text-white dark:text-black px-4 py-3 rounded-2xl rounded-br-md text-sm leading-relaxed">

                ${escapeHTML(text)}

            </div>

        </div>

    `;

    messages.appendChild(message);

    scrollToBottom();

}



/* =========================
   AI LOADING
========================= */

function addLoadingMessage() {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.id =
        "loadingMessage";

    message.className =
        "chat-message flex justify-start";

    message.innerHTML = `

        <div class="max-w-[92%]">

            <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 px-4 py-4 rounded-2xl rounded-bl-md shadow-sm">

                <div class="flex items-center gap-2">

                    <div class="w-6 h-6 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center text-[10px]">
                        S
                    </div>

                    <span class="text-xs font-semibold">
                        Study-AI
                    </span>

                </div>


                <div class="flex gap-1 mt-3">

                    <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400"></span>

                    <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400"></span>

                    <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400"></span>

                </div>

            </div>

        </div>

    `;

    messages.appendChild(message);

    scrollToBottom();

}



/* =========================
   AI RESPONSE
========================= */

function replaceLoadingMessage(text) {

    const loading =
        document.getElementById("loadingMessage");

    if (!loading) return;


    let html;

    try {

        if (
            typeof marked !== "undefined"
        ) {

            html =
                marked.parse(text);

        } else {

            html =
                escapeHTML(text)
                    .replace(/\n/g, "<br>");

        }

    } catch {

        html =
            escapeHTML(text)
                .replace(/\n/g, "<br>");

    }


    loading.innerHTML = `

        <div class="max-w-[92%]">

            <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 px-4 py-4 rounded-2xl rounded-bl-md shadow-sm">

                <div class="flex items-center justify-between mb-3">

                    <div class="flex items-center gap-2">

                        <div class="w-6 h-6 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center text-[10px]">
                            S
                        </div>

                        <span class="text-xs font-semibold">
                            Study-AI
                        </span>

                    </div>


                    <button
                        onclick="copyAI(this)"
                        class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center text-gray-400">

                        <i class="fa-regular fa-copy text-xs"></i>

                    </button>

                </div>


                <div class="ai-content text-sm leading-6">

                    ${html}

                </div>

            </div>

        </div>

    `;


    scrollToBottom();

}



/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById("userPrompt");

    const text =
        input.value.trim();

    if (!text) return;


    const button =
        document.getElementById("sendButton");


    /* SHOW CHAT */

    document
        .getElementById("welcome")
        .classList.add("hidden");

    document
        .getElementById("messages")
        .classList.remove("hidden");


    /* SHOW USER MESSAGE */

    addUserMessage(text);

    input.value = "";


    /* SHOW LOADING */

    addLoadingMessage();


    button.disabled = true;

    button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin text-xs"></i>';


    try {

        /*
         * IMPORTANT:
         *
         * Send BOTH:
         * 1. Current message
         * 2. Previous chat history
         */

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message: text,

                    history: chatHistory

                })

            });


        /* READ RESPONSE */

        const rawText =
            await response.text();

        let data;

        try {

            data =
                JSON.parse(rawText);

        } catch {

            throw new Error(
                "Server returned an invalid response."
            );

        }


        /* CHECK HTTP ERROR */

        if (!response.ok) {

            throw new Error(
                data.error ||
                `Server error: ${response.status}`
            );

        }


        /* CHECK ANSWER */

        if (
            !data.answer ||
            typeof data.answer !== "string"
        ) {

            throw new Error(
                "AI returned no answer."
            );

        }


        /*
         * SAVE USER MESSAGE
         */

        chatHistory.push({

            role: "user",

            parts: [
                {
                    text: text
                }
            ]

        });


        /*
         * SAVE AI MESSAGE
         */

        chatHistory.push({

            role: "model",

            parts: [
                {
                    text: data.answer
                }
            ]

        });


        /* SHOW AI ANSWER */

        replaceLoadingMessage(
            data.answer
        );


    } catch (error) {

        console.error(
            "Study-AI Error:",
            error
        );


        replaceLoadingMessage(

            "⚠️ **Study-AI Error**\n\n" +
            escapeMarkdown(error.message)

        );

    } finally {

        button.disabled = false;

        button.innerHTML =
            '<i class="fa-solid fa-arrow-up text-xs"></i>';

        input.focus();

    }

}



/* =========================
   COPY AI RESPONSE
========================= */

function copyAI(button) {

    const card =
        button.closest(".bg-white");

    if (!card) return;


    const content =
        card.querySelector(".ai-content");

    if (!content) return;


    navigator.clipboard
        .writeText(content.innerText)

        .then(() => {

            button.innerHTML =
                '<i class="fa-solid fa-check text-xs"></i>';

            setTimeout(() => {

                button.innerHTML =
                    '<i class="fa-regular fa-copy text-xs"></i>';

            }, 1500);

        })

        .catch(() => {

            alert(
                "Could not copy the answer."
            );

        });

}



/* =========================
   NEW CHAT
========================= */

function clearChat() {

    /*
     * Clear AI memory
     */

    chatHistory = [];


    /*
     * Clear messages
     */

    document.getElementById(
        "messages"
    ).innerHTML = "";


    document.getElementById(
        "messages"
    ).classList.add("hidden");


    /*
     * Show welcome
     */

    document.getElementById(
        "welcome"
    ).classList.remove("hidden");


    /*
     * Clear input
     */

    document.getElementById(
        "userPrompt"
    ).value = "";

}



/* =========================
   ESCAPE MARKDOWN
========================= */

function escapeMarkdown(text) {

    return String(text)

        .replace(/\\/g, "\\\\")

        .replace(/\*/g, "\\*")

        .replace(/_/g, "\\_")

        .replace(/`/g, "\\`");

}

</script>

</body>
</html>
