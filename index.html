<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study-AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
    darkMode: "class"
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- PDF.js -->
<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
    type="module">
</script>

<!-- Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    font-family: "Inter", sans-serif;
    transition: background-color .25s, color .25s;
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-thumb {
    background: #c7c7c7;
    border-radius: 20px;
}

.chat-message {
    animation: messageIn .2s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.ai-content p {
    margin: 0 0 10px;
}

.ai-content p:last-child {
    margin-bottom: 0;
}

.ai-content ul,
.ai-content ol {
    margin: 8px 0;
    padding-left: 22px;
}

.ai-content li {
    margin: 5px 0;
}

.ai-content strong {
    font-weight: 700;
}

.ai-content code {
    background: #f1f1f1;
    padding: 2px 5px;
    border-radius: 5px;
}

.dark .ai-content code {
    background: #292d33;
}

.ai-content pre {
    background: #111;
    color: white;
    padding: 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 10px 0;
}

.thinking-dot {
    animation: thinking 1.2s infinite;
}

.thinking-dot:nth-child(2) {
    animation-delay: .15s;
}

.thinking-dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes thinking {

    0%, 60%, 100% {
        opacity: .3;
    }

    30% {
        opacity: 1;
    }

}

.pdf-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    border-radius: 10px;
    font-size: 12px;
}

.progress-bar {
    transition: width .25s ease;
}

</style>
</head>


<body class="bg-[#f8f8f8] dark:bg-[#0d0f12] text-gray-900 dark:text-gray-100 min-h-screen">


<!-- =========================
     HEADER
========================= -->

<header class="h-14 border-b border-gray-200 dark:border-gray-800 bg-white/90 dark:bg-[#0d0f12]/90 backdrop-blur-md sticky top-0 z-50">

    <div class="max-w-4xl mx-auto h-full px-4 flex items-center justify-between">

        <div class="flex items-center gap-2">

            <div class="w-8 h-8 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center font-bold">
                S
            </div>

            <span class="font-bold">
                Study-AI
            </span>

        </div>


        <div class="flex items-center gap-2">

            <button
                onclick="clearChat()"
                class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center"
                title="New chat">

                <i class="fa-solid fa-plus text-xs"></i>

            </button>


            <button
                onclick="toggleDarkMode()"
                class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center"
                title="Toggle dark mode">

                <i id="themeIcon" class="fa-regular fa-moon text-sm"></i>

            </button>

        </div>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="max-w-3xl mx-auto px-4 min-h-[calc(100vh-56px)] flex flex-col">


    <!-- =========================
         WELCOME
    ========================= -->

    <div
        id="welcome"
        class="flex-1 flex flex-col items-center justify-center text-center pb-32">

        <div class="w-12 h-12 rounded-2xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center mb-5 shadow-sm">

            <i class="fa-solid fa-star"></i>

        </div>


        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-3">

            What do you want to learn?

        </h1>


        <p class="text-sm text-gray-500 dark:text-gray-400">

            Ask Study-AI anything or upload your study PDF.

        </p>


        <button
            onclick="openPDFPicker()"
            class="mt-6 px-4 py-2.5 rounded-xl bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 text-sm hover:bg-gray-100 dark:hover:bg-gray-800">

            <i class="fa-solid fa-file-pdf mr-2"></i>

            Upload PDF

        </button>

    </div>



    <!-- =========================
         MESSAGES
    ========================= -->

    <div
        id="messages"
        class="flex-1 py-6 space-y-6 hidden">

    </div>



    <!-- =========================
         INPUT
    ========================= -->

    <div class="sticky bottom-0 pb-5 pt-3 bg-gradient-to-t from-[#f8f8f8] dark:from-[#0d0f12] via-[#f8f8f8] dark:via-[#0d0f12] to-transparent">


        <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 rounded-2xl shadow-sm overflow-hidden">


            <!-- PDF STATUS -->

            <div
                id="pdfStatus"
                class="hidden px-4 pt-3">

                <div class="pdf-badge bg-gray-100 dark:bg-gray-800">

                    <i class="fa-solid fa-file-pdf"></i>

                    <span id="pdfName">
                        PDF
                    </span>

                    <button
                        onclick="removePDF()"
                        class="ml-1 text-gray-400 hover:text-gray-700 dark:hover:text-white">

                        <i class="fa-solid fa-xmark"></i>

                    </button>

                </div>


                <!-- OCR PROGRESS -->

                <div
                    id="ocrProgressContainer"
                    class="hidden mt-2">

                    <div class="flex justify-between text-[10px] text-gray-400 mb-1">

                        <span id="ocrStatus">
                            Reading PDF...
                        </span>

                        <span id="ocrPercent">
                            0%
                        </span>

                    </div>


                    <div class="h-1 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">

                        <div
                            id="ocrProgress"
                            class="progress-bar h-full bg-black dark:bg-white"
                            style="width:0%">
                        </div>

                    </div>

                </div>

            </div>



            <!-- TEXT INPUT -->

            <textarea
                id="userPrompt"
                rows="2"
                placeholder="Message Study-AI..."
                class="w-full px-4 pt-4 pb-2 bg-transparent outline-none resize-none text-sm placeholder-gray-400 dark:placeholder-gray-500"
                onkeydown="handleKeyDown(event)">
            </textarea>



            <div class="flex items-center justify-between px-3 pb-3 pt-1">


                <div class="flex items-center gap-2">


                    <!-- PDF -->

                    <button
                        onclick="openPDFPicker()"
                        class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"
                        title="Upload PDF">

                        <i class="fa-solid fa-paperclip text-xs"></i>

                    </button>


                    <!-- MATH -->

                    <button
                        onclick="insertMath()"
                        class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"
                        title="Math">

                        <i class="fa-solid fa-calculator text-xs"></i>

                    </button>


                    <!-- EXPLAIN -->

                    <button
                        onclick="quickQuestion('Explain this topic in simple words.')"
                        class="hidden sm:block px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs hover:bg-gray-200 dark:hover:bg-gray-700">

                        Explain

                    </button>


                    <!-- QUESTIONS -->

                    <button
                        onclick="quickQuestion('Create 5 important exam questions from this PDF.')"
                        class="hidden sm:block px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs hover:bg-gray-200 dark:hover:bg-gray-700">

                        Questions

                    </button>

                </div>



                <!-- SEND -->

                <button
                    id="sendButton"
                    onclick="sendMessage()"
                    class="w-9 h-9 rounded-xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center hover:opacity-80 disabled:opacity-40">

                    <i class="fa-solid fa-arrow-up text-xs"></i>

                </button>

            </div>

        </div>


        <p class="text-center text-[10px] text-gray-400 mt-2">

            Study-AI can make mistakes. Check important answers.

        </p>

    </div>

</main>



<!-- PDF INPUT -->

<input
    type="file"
    id="pdfInput"
    accept="application/pdf"
    class="hidden"
    onchange="handlePDFUpload(event)"
>



<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

window.pdfjsLib = pdfjsLib;

</script>



<script>

/* =========================
   DATA
========================= */

let chatHistory = [];

let pdfText = "";

let pdfFileName = "";

let pdfReady = false;



/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

    document.documentElement.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.documentElement.classList.contains("dark")
            ? "dark"
            : "light"
    );

    updateThemeIcon();

}


function updateThemeIcon() {

    const icon =
        document.getElementById("themeIcon");

    if (!icon) return;


    if (
        document.documentElement.classList.contains("dark")
    ) {

        icon.className =
            "fa-regular fa-sun text-sm";

    } else {

        icon.className =
            "fa-regular fa-moon text-sm";

    }

}


if (
    localStorage.getItem("theme") === "dark"
) {

    document.documentElement.classList.add("dark");

}

updateThemeIcon();



/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}



/* =========================
   ENTER
========================= */

function handleKeyDown(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}



/* =========================
   QUICK QUESTION
========================= */

function quickQuestion(text) {

    const input =
        document.getElementById("userPrompt");

    input.value = text;

    input.focus();

}



/* =========================
   MATH
========================= */

function insertMath() {

    const input =
        document.getElementById("userPrompt");

    input.value =
        "Solve this equation step-by-step: 2x² + 5x - 3 = 0";

    input.focus();

}



/* =========================
   PDF PICKER
========================= */

function openPDFPicker() {

    document
        .getElementById("pdfInput")
        .click();

}



/* =========================
   PDF UPLOAD
========================= */

async function handlePDFUpload(event) {

    const file =
        event.target.files[0];

    if (!file) return;


    if (
        file.type !== "application/pdf"
    ) {

        alert(
            "Please select a PDF file."
        );

        return;

    }


    if (
        file.size > 20 * 1024 * 1024
    ) {

        alert(
            "Please upload a PDF smaller than 20 MB."
        );

        return;

    }


    try {

        pdfReady = false;

        pdfText = "";

        pdfFileName = file.name;


        showPDFLoading(file.name);


        const arrayBuffer =
            await file.arrayBuffer();


        const pdf =
            await window.pdfjsLib
                .getDocument({
                    data: arrayBuffer
                })
                .promise;


        let extractedText = "";


        /*
         * First attempt:
         * normal selectable PDF text.
         */

        for (
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ) {

            updateOCRProgress(
                `Reading page ${pageNumber} of ${pdf.numPages}...`,
                Math.round(
                    (pageNumber / pdf.numPages) * 50
                )
            );


            const page =
                await pdf.getPage(pageNumber);


            const content =
                await page.getTextContent();


            const pageText =
                content.items
                    .map(item => item.str)
                    .join(" ");


            extractedText +=

                `\n\n--- Page ${pageNumber} ---\n\n` +

                pageText;

        }


        extractedText =
            extractedText.trim();


        /*
         * If enough text exists,
         * use it directly.
         */

        if (
            extractedText.length >= 100
        ) {

            pdfText =
                extractedText;

            pdfReady = true;


            showPDFLoaded(
                file.name,
                "Text extracted"
            );


        } else {

            /*
             * =========================
             * OCR FALLBACK
             * =========================
             */

            updateOCRProgress(
                "Scanned PDF detected. Starting OCR...",
                50
            );


            let ocrText = "";


            for (
                let pageNumber = 1;
                pageNumber <= pdf.numPages;
                pageNumber++
            ) {

                updateOCRProgress(
                    `OCR page ${pageNumber} of ${pdf.numPages}...`,
                    50 +
                    Math.round(
                        (pageNumber / pdf.numPages) * 50
                    )
                );


                const page =
                    await pdf.getPage(pageNumber);


                const viewport =
                    page.getViewport({
                        scale: 1.5
                    });


                const canvas =
                    document.createElement("canvas");


                const context =
                    canvas.getContext("2d");


                canvas.width =
                    viewport.width;


                canvas.height =
                    viewport.height;


                await page.render({

                    canvasContext:
                        context,

                    viewport:
                        viewport

                }).promise;


                const image =
                    canvas.toDataURL(
                        "image/png"
                    );


                const result =
                    await Tesseract.recognize(
                        image,
                        "eng",
                        {
                            logger: info => {

                                if (
                                    info.status ===
                                    "recognizing text"
                                ) {

                                    const local =
                                        Math.round(
                                            info.progress * 100
                                        );

                                    updateOCRProgress(
                                        `OCR page ${pageNumber}...`,
                                        Math.min(
                                            99,
                                            50 +
                                            Math.round(
                                                (
                                                    (
                                                        pageNumber - 1
                                                    ) /
                                                    pdf.numPages
                                                ) * 50
                                            ) +
                                            Math.round(
                                                local /
                                                pdf.numPages /
                                                2
                                            )
                                        )
                                    );

                                }

                            }
                        }
                    );


                ocrText +=

                    `\n\n--- Page ${pageNumber} ---\n\n` +

                    result.data.text;

            }


            pdfText =
                ocrText.trim();


            if (!pdfText) {

                throw new Error(
                    "Could not extract text from this PDF."
                );

            }


            pdfReady = true;


            showPDFLoaded(
                file.name,
                "OCR completed"
            );

        }


        /*
         * Show chat.
         */

        document
            .getElementById("welcome")
            .classList.add("hidden");


        document
            .getElementById("messages")
            .classList.remove("hidden");


        addSystemMessage(

            `📄 **${file.name}** is ready.\n\n` +

            `I extracted the text from your PDF. ` +

            `You can now ask questions about it.`

        );


    } catch (error) {

        console.error(
            "PDF processing error:",
            error
        );


        alert(
            error.message ||
            "Could not process this PDF."
        );


        removePDF();

    }

}



/* =========================
   PDF LOADING
========================= */

function showPDFLoading(name) {

    document
        .getElementById("pdfStatus")
        .classList.remove("hidden");


    document
        .getElementById("ocrProgressContainer")
        .classList.remove("hidden");


    document
        .getElementById("pdfName")
        .textContent =
        name;


    updateOCRProgress(
        "Reading PDF...",
        0
    );

}



/* =========================
   PROGRESS
========================= */

function updateOCRProgress(
    status,
    percent
) {

    document
        .getElementById("ocrStatus")
        .textContent =
        status;


    document
        .getElementById("ocrPercent")
        .textContent =
        `${percent}%`;


    document
        .getElementById("ocrProgress")
        .style.width =
        `${percent}%`;

}



/* =========================
   PDF READY
========================= */

function showPDFLoaded(
    name,
    method
) {

    document
        .getElementById("pdfStatus")
        .classList.remove("hidden");


    document
        .getElementById("pdfName")
        .textContent =
        `${name} • ${method}`;


    updateOCRProgress(
        "PDF ready",
        100
    );


    setTimeout(() => {

        document
            .getElementById("ocrProgressContainer")
            .classList.add("hidden");

    }, 1000);

}



/* =========================
   REMOVE PDF
========================= */

function removePDF() {

    pdfText = "";

    pdfFileName = "";

    pdfReady = false;


    document
        .getElementById("pdfStatus")
        .classList.add("hidden");


    document
        .getElementById("ocrProgressContainer")
        .classList.add("hidden");


    document
        .getElementById("pdfInput")
        .value = "";

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}



/* =========================
   SYSTEM MESSAGE
========================= */

function addSystemMessage(text) {

    const messages =
        document.getElementById("messages");


    const message =
        document.createElement("div");


    message.className =
        "chat-message flex justify-start";


    let html;


    try {

        html =
            marked.parse(text);

    } catch {

        html =
            escapeHTML(text)
                .replace(/\n/g, "<br>");

    }


    message.innerHTML = `

        <div class="max-w-[92%]">

            <div class="bg-gray-100 dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 px-4 py-3 rounded-2xl text-sm">

                <div class="ai-content">

                    ${html}

                </div>

            </div>

        </div>

    `;


    messages.appendChild(message);

}



/* =========================
   USER MESSAGE
========================= */

function addUserMessage(text) {

    const messages =
        document.getElementById("messages");


    const message =
        document.createElement("div");


    message.className =
        "chat-message flex justify-end";


    message.innerHTML = `

        <div class="max-w-[85%]">

            <div class="bg-black dark:bg-white text-white dark:text-black px-4 py-3 rounded-2xl rounded-br-md text-sm leading-relaxed">

                ${escapeHTML(text)}

            </div>

        </div>

    `;


    messages.appendChild(message);

    scrollToBottom();

}



/* =========================
   LOADING
========================= */

function addLoadingMessage() {

    const messages =
        document.getElementById("messages");


    const message =
        document.createElement("div");


    message.id =
        "loadingMessage";


    message.className =
        "chat-message flex justify-start";


    message.innerHTML = `

        <div class="max-w-[92%]">

            <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 px-4 py-4 rounded-2xl rounded-bl-md shadow-sm">

                <div class="flex items-center gap-2">

                    <div class="w-6 h-6 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center text-[10px]">
                        S
                    </div>

                    <span class="text-xs font-semibold">
                        Study-AI
                    </span>

                </div>


                <div class="flex gap-1 mt-3">

                    <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400"></span>

                    <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400"></span>

                    <span class="thinking-dot w-1.5 h-1.5 rounded-full bg-gray-400"></span>

                </div>

            </div>

        </div>

    `;


    messages.appendChild(message);

    scrollToBottom();

}



/* =========================
   AI RESPONSE
========================= */

function replaceLoadingMessage(text) {

    const loading =
        document.getElementById(
            "loadingMessage"
        );


    if (!loading) return;


    let html;


    try {

        html =
            marked.parse(text);

    } catch {

        html =
            escapeHTML(text)
                .replace(/\n/g, "<br>");

    }


    loading.innerHTML = `

        <div class="max-w-[92%]">

            <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 px-4 py-4 rounded-2xl rounded-bl-md shadow-sm">

                <div class="flex items-center justify-between mb-3">

                    <div class="flex items-center gap-2">

                        <div class="w-6 h-6 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center text-[10px]">
                            S
                        </div>

                        <span class="text-xs font-semibold">
                            Study-AI
                        </span>

                    </div>


                    <button
                        onclick="copyAI(this)"
                        class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center text-gray-400">

                        <i class="fa-regular fa-copy text-xs"></i>

                    </button>

                </div>


                <div class="ai-content text-sm leading-6">

                    ${html}

                </div>

            </div>

        </div>

    `;


    scrollToBottom();

}



/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "userPrompt"
        );


    const text =
        input.value.trim();


    if (!text) return;


    const button =
        document.getElementById(
            "sendButton"
        );


    /*
     * Show chat
     */

    document
        .getElementById("welcome")
        .classList.add("hidden");


    document
        .getElementById("messages")
        .classList.remove("hidden");


    /*
     * User message
     */

    addUserMessage(text);


    input.value = "";


    /*
     * Loading
     */

    addLoadingMessage();


    button.disabled = true;


    button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin text-xs"></i>';


    try {

        /*
         * Send:
         *
         * message
         * history
         * PDF text
         * PDF filename
         */

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            history:
                                chatHistory,

                            pdfText:
                                pdfReady
                                    ? pdfText
                                    : "",

                            pdfFileName:
                                pdfReady
                                    ? pdfFileName
                                    : ""

                        })

                }
            );


        const rawText =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(rawText);

        } catch {

            throw new Error(
                "Server returned an invalid response."
            );

        }


        if (!response.ok) {

            throw new Error(

                data.error ||
                `Server error: ${response.status}`

            );

        }


        if (
            !data.answer ||
            typeof data.answer !== "string"
        ) {

            throw new Error(
                "AI returned no answer."
            );

        }


        /*
         * Save user message
         */

        chatHistory.push({

            role:
                "user",

            parts: [

                {
                    text:
                        text
                }

            ]

        });


        /*
         * Save AI answer
         */

        chatHistory.push({

            role:
                "model",

            parts: [

                {
                    text:
                        data.answer
                }

            ]

        });


        replaceLoadingMessage(
            data.answer
        );


    } catch (error) {

        console.error(
            "Study-AI Error:",
            error
        );


        replaceLoadingMessage(

            "⚠️ **Study-AI Error**\n\n" +

            escapeMarkdown(
                error.message
            )

        );

    } finally {

        button.disabled = false;


        button.innerHTML =
            '<i class="fa-solid fa-arrow-up text-xs"></i>';


        input.focus();

    }

}



/* =========================
   COPY
========================= */

function copyAI(button) {

    const card =
        button.closest(
            ".bg-white"
        );


    if (!card) return;


    const content =
        card.querySelector(
            ".ai-content"
        );


    if (!content) return;


    navigator.clipboard
        .writeText(
            content.innerText
        )

        .then(() => {

            button.innerHTML =
                '<i class="fa-solid fa-check text-xs"></i>';


            setTimeout(() => {

                button.innerHTML =
                    '<i class="fa-regular fa-copy text-xs"></i>';

            }, 1500);

        })

        .catch(() => {

            alert(
                "Could not copy the answer."
            );

        });

}



/* =========================
   NEW CHAT
========================= */

function clearChat() {

    chatHistory = [];


    removePDF();


    document
        .getElementById("messages")
        .innerHTML = "";


    document
        .getElementById("messages")
        .classList.add("hidden");


    document
        .getElementById("welcome")
        .classList.remove("hidden");


    document
        .getElementById("userPrompt")
        .value = "";

}



/* =========================
   ESCAPE MARKDOWN
========================= */

function escapeMarkdown(text) {

    return String(text)

        .replace(/\\/g, "\\\\")

        .replace(/\*/g, "\\*")

        .replace(/_/g, "\\_")

        .replace(/`/g, "\\`");

}
