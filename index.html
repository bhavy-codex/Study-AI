<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Study-AI</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- PDF.js -->
  <script type="module">
    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    window.pdfjsLib = pdfjsLib;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  </script>

  <!-- OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      transition: .25s;
    }

    body.dark {
      background: #020617;
      color: #e2e8f0;
    }

    .glass {
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148,163,184,.2);
    }

    .dark .glass {
      background: rgba(15,23,42,.85);
      border-color: rgba(148,163,184,.15);
    }

    .message-user {
      background: #2563eb;
      color: white;
    }

    .message-ai {
      background: white;
      border: 1px solid #e2e8f0;
    }

    .dark .message-ai {
      background: #0f172a;
      color: #e2e8f0;
      border-color: #1e293b;
    }

    textarea {
      resize: none;
      outline: none;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      animation: bounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%,60%,100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    .mic-listening {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(239,68,68,.5);
      }

      70% {
        box-shadow: 0 0 0 14px rgba(239,68,68,0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239,68,68,0);
      }
    }

    .hidden {
      display: none !important;
    }

    .markdown-content p {
      margin: .35rem 0;
    }

    .markdown-content ul {
      list-style: disc;
      padding-left: 1.4rem;
    }

    .markdown-content ol {
      list-style: decimal;
      padding-left: 1.4rem;
    }

    .markdown-content pre {
      overflow-x: auto;
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 10px;
    }

    .preview-image {
      max-height: 220px;
      max-width: 100%;
      border-radius: 14px;
      object-fit: contain;
    }
  </style>
</head>

<body>

<header class="sticky top-0 z-50 glass">
  <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">

    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>

      <div>
        <h1 class="font-bold text-lg">Study-AI</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Your AI Study Assistant
        </p>
      </div>
    </div>

    <div class="flex gap-2">

      <button
        id="newChatBtn"
        class="w-10 h-10 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800"
        title="New Chat"
      >
        <i class="fa-solid fa-plus"></i>
      </button>

      <button
        id="themeBtn"
        class="w-10 h-10 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800"
        title="Theme"
      >
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>

    </div>
  </div>
</header>


<main class="max-w-5xl mx-auto px-4 py-6">

  <!-- WELCOME -->
  <section id="welcomeSection" class="text-center py-12">

    <div class="mx-auto mb-5 w-20 h-20 rounded-3xl bg-blue-600 text-white flex items-center justify-center shadow-xl">
      <i class="fa-solid fa-brain text-3xl"></i>
    </div>

    <h2 class="text-3xl sm:text-4xl font-bold mb-3">
      What do you want to learn?
    </h2>

    <p class="text-slate-500 dark:text-slate-400">
      Ask questions, upload PDFs, scan notes, or show Study-AI a picture.
    </p>

    <div class="flex flex-wrap justify-center gap-3 mt-7">

      <button
        id="mathBtn"
        class="px-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"
      >
        <i class="fa-solid fa-calculator mr-2 text-blue-500"></i>
        Math
      </button>

      <button
        id="explainBtn"
        class="px-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"
      >
        <i class="fa-solid fa-lightbulb mr-2 text-yellow-500"></i>
        Explain
      </button>

      <button
        id="solveBtn"
        class="px-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800"
      >
        <i class="fa-solid fa-list-check mr-2 text-green-500"></i>
        Solve
      </button>

      <!-- IMAGE -->
      <label
        class="px-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 cursor-pointer"
      >
        <i class="fa-solid fa-image mr-2 text-purple-500"></i>
        Add Image

        <input
          id="welcomeImageInput"
          type="file"
          accept="image/*"
          capture="environment"
          class="hidden"
        />
      </label>

      <!-- PDF -->
      <label
        class="px-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 cursor-pointer"
      >
        <i class="fa-solid fa-file-pdf mr-2 text-red-500"></i>
        Upload PDF

        <input
          id="welcomePdfInput"
          type="file"
          accept="application/pdf,.pdf"
          class="hidden"
        />
      </label>

    </div>

    <div class="mt-6 text-sm text-slate-400">
      <i class="fa-solid fa-microphone mr-1"></i>
      You can also ask using your voice.
    </div>

  </section>


  <!-- IMAGE PREVIEW -->
  <div id="imagePreviewBox" class="hidden mb-4">

    <div class="glass rounded-2xl p-4">

      <div class="flex justify-between items-center mb-3">

        <div class="font-semibold">
          <i class="fa-solid fa-image text-purple-500 mr-2"></i>
          Image ready
        </div>

        <button
          id="removeImageBtn"
          class="w-9 h-9 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

      <img
        id="imagePreview"
        class="preview-image mx-auto"
        alt="Selected image"
      />

      <p
        id="imageName"
        class="text-xs text-slate-500 dark:text-slate-400 mt-2 text-center"
      ></p>

    </div>

  </div>


  <!-- PDF STATUS -->
  <div id="pdfStatus" class="hidden mb-4">

    <div class="glass rounded-2xl px-4 py-3 flex justify-between items-center">

      <div class="flex items-center gap-3 min-w-0">

        <div class="w-10 h-10 rounded-xl bg-red-100 dark:bg-red-950 text-red-600 flex items-center justify-center">
          <i class="fa-solid fa-file-pdf"></i>
        </div>

        <div class="min-w-0">

          <div class="font-semibold text-sm">
            PDF ready
          </div>

          <div
            id="pdfName"
            class="text-xs text-slate-500 truncate"
          ></div>

        </div>

      </div>

      <button
        id="removePdfBtn"
        class="w-9 h-9 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>

  </div>


  <!-- OCR -->
  <div id="ocrStatus" class="hidden mb-4">

    <div class="glass rounded-2xl p-4">

      <div class="flex items-center gap-3">

        <i class="fa-solid fa-spinner fa-spin text-blue-500"></i>

        <div class="flex-1">

          <div id="ocrText" class="text-sm">
            Reading PDF...
          </div>

          <div class="mt-2 h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">

            <div
              id="ocrProgress"
              class="h-full bg-blue-600"
              style="width:0%"
            ></div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- VOICE STATUS -->
  <div id="voiceStatus" class="hidden mb-4">

    <div class="glass rounded-2xl p-4 flex justify-between items-center">

      <div class="flex items-center gap-3">

        <i class="fa-solid fa-wave-square text-blue-500"></i>

        <div>

          <div class="font-semibold text-sm">
            Listening...
          </div>

          <div
            id="voiceStatusText"
            class="text-xs text-slate-500"
          >
            Speak your question
          </div>

        </div>

      </div>

      <button
        id="stopVoiceBtn"
        class="px-3 py-2 rounded-lg bg-red-500 text-white text-sm"
      >
        Stop
      </button>

    </div>

  </div>


  <!-- MESSAGES -->
  <section
    id="messages"
    class="space-y-4 mb-32"
  ></section>

</main>


<!-- INPUT -->
<div class="fixed bottom-0 left-0 right-0 z-40">

  <div class="max-w-5xl mx-auto px-4 pb-4">

    <div class="glass rounded-2xl shadow-2xl p-2">

      <div class="flex items-end gap-2">

        <!-- IMAGE BUTTON -->
        <label
          class="w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-800 shrink-0"
          title="Add image"
        >

          <i class="fa-solid fa-camera"></i>

          <input
            id="imageInput"
            type="file"
            accept="image/*"
            capture="environment"
            class="hidden"
          />

        </label>


        <!-- PDF -->
        <label
          class="w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-800 shrink-0"
          title="Upload PDF"
        >

          <i class="fa-solid fa-paperclip"></i>

          <input
            id="pdfInput"
            type="file"
            accept="application/pdf,.pdf"
            class="hidden"
          />

        </label>


        <!-- TEXT -->
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Ask Study-AI anything..."
          class="flex-1 bg-transparent px-2 py-3 max-h-32"
        ></textarea>


        <!-- MIC -->
        <button
          id="micBtn"
          class="w-11 h-11 rounded-xl flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-800 shrink-0"
          title="Voice input"
        >
          <i id="micIcon" class="fa-solid fa-microphone"></i>
        </button>


        <!-- SEND -->
        <button
          id="sendBtn"
          class="w-11 h-11 rounded-xl bg-blue-600 text-white flex items-center justify-center shrink-0"
          title="Send"
        >
          <i class="fa-solid fa-arrow-up"></i>
        </button>

      </div>

      <div class="px-2 pb-1 pt-1 text-[11px] text-slate-400">
        📸 Upload an image and ask Study-AI to explain or solve it.
      </div>

    </div>

  </div>

</div>


<script>

  /* =====================================================
     STATE
  ===================================================== */

  let chatHistory = [];

  let pdfText = "";
  let pdfFileName = "";
  let pdfReady = false;

  let imageBase64 = "";
  let imageMimeType = "";
  let imageFileName = "";

  let recognition = null;
  let isListening = false;


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const messages =
    document.getElementById("messages");

  const welcomeSection =
    document.getElementById("welcomeSection");

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const micBtn =
    document.getElementById("micBtn");

  const micIcon =
    document.getElementById("micIcon");

  const voiceStatus =
    document.getElementById("voiceStatus");

  const voiceStatusText =
    document.getElementById("voiceStatusText");

  const stopVoiceBtn =
    document.getElementById("stopVoiceBtn");

  const imageInput =
    document.getElementById("imageInput");

  const welcomeImageInput =
    document.getElementById("welcomeImageInput");

  const imagePreviewBox =
    document.getElementById("imagePreviewBox");

  const imagePreview =
    document.getElementById("imagePreview");

  const imageName =
    document.getElementById("imageName");

  const removeImageBtn =
    document.getElementById("removeImageBtn");

  const pdfInput =
    document.getElementById("pdfInput");

  const welcomePdfInput =
    document.getElementById("welcomePdfInput");

  const pdfStatus =
    document.getElementById("pdfStatus");

  const pdfName =
    document.getElementById("pdfName");

  const removePdfBtn =
    document.getElementById("removePdfBtn");

  const ocrStatus =
    document.getElementById("ocrStatus");

  const ocrText =
    document.getElementById("ocrText");

  const ocrProgress =
    document.getElementById("ocrProgress");

  const newChatBtn =
    document.getElementById("newChatBtn");

  const themeBtn =
    document.getElementById("themeBtn");

  const themeIcon =
    document.getElementById("themeIcon");


  /* =====================================================
     THEME
     ===================================================== */

  const savedTheme =
    localStorage.getItem("theme");

  if (savedTheme === "dark") {

    document.body.classList.add("dark");

    themeIcon.className =
      "fa-solid fa-sun";

  }


  themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("dark");

    const dark =
      document.body.classList.contains("dark");

    localStorage.setItem(
      "theme",
      dark ? "dark" : "light"
    );

    themeIcon.className =
      dark
        ? "fa-solid fa-sun"
        : "fa-solid fa-moon";

  });


  /* =====================================================
     HELPERS
     ===================================================== */

  function scrollToBottom() {

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

  }


  function addMessage(
    role,
    text,
    allowSpeak = false,
    imageData = null
  ) {

    welcomeSection.classList.add("hidden");

    const wrapper =
      document.createElement("div");

    wrapper.className =
      role === "user"
        ? "flex justify-end"
        : "flex justify-start";

    const bubble =
      document.createElement("div");

    bubble.className =
      role === "user"
        ? "message-user max-w-[88%] rounded-2xl rounded-br-md px-4 py-3"
        : "message-ai max-w-[88%] rounded-2xl rounded-bl-md px-4 py-3";


    if (imageData) {

      const img =
        document.createElement("img");

      img.src = imageData;

      img.className =
        "max-w-full max-h-56 rounded-xl mb-3 object-contain";

      bubble.appendChild(img);

    }


    if (role === "model") {

      const content =
        document.createElement("div");

      content.className =
        "markdown-content text-sm leading-6";

      try {

        content.innerHTML =
          marked.parse(text);

      } catch {

        content.textContent =
          text;

      }

      bubble.appendChild(content);


      if (allowSpeak) {

        const speakButton =
          document.createElement("button");

        speakButton.className =
          "mt-3 px-3 py-1.5 rounded-lg text-xs bg-slate-100 dark:bg-slate-800";

        speakButton.innerHTML =
          '<i class="fa-solid fa-volume-high mr-1"></i> Listen';

        speakButton.addEventListener(
          "click",
          () => speakText(text, speakButton)
        );

        bubble.appendChild(speakButton);

      }

    } else {

      if (text) {

        const textDiv =
          document.createElement("div");

        textDiv.textContent =
          text;

        bubble.appendChild(textDiv);

      }

    }


    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    scrollToBottom();

  }


  function addTyping() {

    const wrapper =
      document.createElement("div");

    wrapper.id =
      "typingIndicator";

    wrapper.className =
      "flex justify-start";

    wrapper.innerHTML = `
      <div class="message-ai rounded-2xl rounded-bl-md px-4 py-3">
        <div class="flex gap-1">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      </div>
    `;

    messages.appendChild(wrapper);

    scrollToBottom();

  }


  function removeTyping() {

    document
      .getElementById("typingIndicator")
      ?.remove();

  }


  /* =====================================================
     SEND CHAT / IMAGE
     ===================================================== */

  async function sendMessage(customMessage = null) {

    const message =
      customMessage !== null
        ? customMessage.trim()
        : messageInput.value.trim();


    /*
      If user selected an image but didn't type anything,
      still give Gemini a useful instruction.
    */

    const finalMessage =
      message ||
      (
        imageBase64
          ? "Please analyze this image and explain what it shows. If it contains a question, solve it step by step."
          : ""
      );


    if (!finalMessage) return;


    const sentImage =
      imageBase64;


    messageInput.value = "";

    messageInput.style.height =
      "auto";


    addMessage(
      "user",
      finalMessage,
      false,
      sentImage || null
    );


    chatHistory.push({

      role: "user",

      parts: [
        {
          text: finalMessage
        }
      ]

    });


    addTyping();

    sendBtn.disabled = true;
    micBtn.disabled = true;


    try {

      const response =
        await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            message: finalMessage,

            history:
              chatHistory.slice(-12),

            pdfText,

            pdfFileName,

            imageBase64,

            imageMimeType

          })

        });


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data?.error ||
          `Request failed (${response.status})`
        );

      }


      const answer =
        data?.answer ||
        "Sorry, I couldn't generate an answer.";


      removeTyping();


      addMessage(
        "model",
        answer,
        true
      );


      chatHistory.push({

        role: "model",

        parts: [
          {
            text: answer
          }
        ]

      });


      /*
        Clear image after sending.
      */

      if (sentImage) {

        clearImage();

      }


    } catch (error) {

      removeTyping();

      addMessage(
        "model",
        `⚠️ ${error.message || "Something went wrong."}`,
        false
      );

    } finally {

      sendBtn.disabled = false;
      micBtn.disabled = false;

    }

  }


  sendBtn.addEventListener(
    "click",
    () => sendMessage()
  );


  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  messageInput.addEventListener(
    "input",
    () => {

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          128
        ) + "px";

    }
  );


  /* =====================================================
     QUICK BUTTONS
     ===================================================== */

  document.getElementById("mathBtn")
    .addEventListener("click", () => {

      messageInput.value =
        "Help me solve this math problem step by step: ";

      messageInput.focus();

    });


  document.getElementById("explainBtn")
    .addEventListener("click", () => {

      messageInput.value =
        "Explain this topic in very simple words: ";

      messageInput.focus();

    });


  document.getElementById("solveBtn")
    .addEventListener("click", () => {

      messageInput.value =
        "Solve this question step by step: ";

      messageInput.focus();

    });


  /* =====================================================
     IMAGE UPLOAD
     ===================================================== */

  imageInput.addEventListener(
    "change",
    event => {

      const file =
        event.target.files?.[0];

      if (file) {
        processImage(file);
      }

    }
  );


  welcomeImageInput.addEventListener(
    "change",
    event => {

      const file =
        event.target.files?.[0];

      if (file) {
        processImage(file);
      }

    }
  );


  async function processImage(file) {

    if (!file.type.startsWith("image/")) {

      alert("Please select an image.");

      return;

    }


    /*
      Keep browser payload reasonably small.
    */

    if (file.size > 10 * 1024 * 1024) {

      alert(
        "Image is too large. Please use an image under 10 MB."
      );

      return;

    }


    try {

      const reader =
        new FileReader();


      reader.onload = () => {

        imageBase64 =
          reader.result;

        imageMimeType =
          file.type || "image/jpeg";

        imageFileName =
          file.name;


        imagePreview.src =
          imageBase64;

        imageName.textContent =
          file.name;


        imagePreviewBox.classList.remove(
          "hidden"
        );


        messageInput.focus();

      };


      reader.onerror = () => {

        alert(
          "Could not read this image."
        );

      };


      reader.readAsDataURL(file);

    } catch (error) {

      console.error(error);

      alert(
        "Could not process this image."
      );

    }

  }


  /* =====================================================
     CLEAR IMAGE
     ===================================================== */

  function clearImage() {

    imageBase64 = "";
    imageMimeType = "";
    imageFileName = "";

    imageInput.value = "";
    welcomeImageInput.value = "";

    imagePreview.src = "";

    imageName.textContent = "";

    imagePreviewBox.classList.add(
      "hidden"
    );

  }


  removeImageBtn.addEventListener(
    "click",
    clearImage
  );


  /* =====================================================
     PDF
     ===================================================== */

  pdfInput.addEventListener(
    "change",
    event => {

      const file =
        event.target.files?.[0];

      if (file) {
        processPDF(file);
      }

    }
  );


  welcomePdfInput.addEventListener(
    "change",
    event => {

      const file =
        event.target.files?.[0];

      if (file) {
        processPDF(file);
      }

    }
  );


  async function processPDF(file) {

    if (
      file.type !== "application/pdf" &&
      !file.name.toLowerCase().endsWith(".pdf")
    ) {

      alert("Please select a PDF file.");

      return;

    }


    if (file.size > 20 * 1024 * 1024) {

      alert(
        "PDF is too large. Maximum size is 20 MB."
      );

      return;

    }


    pdfText = "";
    pdfFileName = file.name;
    pdfReady = false;


    pdfStatus.classList.remove(
      "hidden"
    );

    pdfName.textContent =
      file.name;


    ocrStatus.classList.remove(
      "hidden"
    );

    ocrText.textContent =
      "Opening PDF...";

    ocrProgress.style.width =
      "0%";


    try {

      const arrayBuffer =
        await file.arrayBuffer();


      const pdf =
        await window.pdfjsLib.getDocument({
          data: arrayBuffer
        }).promise;


      let extractedText = "";


      for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ) {

        ocrText.textContent =
          `Reading PDF page ${pageNumber} of ${pdf.numPages}...`;


        const page =
          await pdf.getPage(pageNumber);


        const content =
          await page.getTextContent();


        const pageText =
          content.items
            .map(item => item.str)
            .join(" ");


        extractedText +=
          `\n\n--- Page ${pageNumber} ---\n${pageText}`;


        ocrProgress.style.width =
          `${Math.round(
            (pageNumber / pdf.numPages) * 50
          )}%`;

      }


      /*
        Normal PDF text found.
      */

      if (
        extractedText.trim().length >= 100
      ) {

        pdfText =
          extractedText.trim();

        pdfReady = true;

        ocrText.textContent =
          "PDF text extracted successfully.";

        ocrProgress.style.width =
          "100%";

        setTimeout(() => {
          ocrStatus.classList.add("hidden");
        }, 800);

        return;

      }


      /*
        OCR fallback.
      */

      let ocrResult = "";


      for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ) {

        ocrText.textContent =
          `OCR page ${pageNumber} of ${pdf.numPages}...`;


        const page =
          await pdf.getPage(pageNumber);


        const viewport =
          page.getViewport({
            scale: 1.5
          });


        const canvas =
          document.createElement("canvas");


        const context =
          canvas.getContext("2d");


        canvas.width =
          viewport.width;

        canvas.height =
          viewport.height;


        await page.render({

          canvasContext:
            context,

          viewport

        }).promise;


        const result =
          await Tesseract.recognize(
            canvas,
            "eng",
            {
              logger: info => {

                if (
                  info.status === "recognizing text" &&
                  typeof info.progress === "number"
                ) {

                  const progress =
                    50 +
                    (
                      (
                        pageNumber - 1 +
                        info.progress
                      ) /
                      pdf.numPages
                    ) * 50;

                  ocrProgress.style.width =
                    `${Math.min(
                      100,
                      Math.round(progress)
                    )}%`;

                }

              }
            }
          );


        ocrResult +=
          `\n\n--- Page ${pageNumber} ---\n${result.data.text}`;

      }


      pdfText =
        ocrResult.trim();


      if (!pdfText) {

        throw new Error(
          "Could not read any text from this PDF."
        );

      }


      pdfReady = true;

      ocrText.textContent =
        "PDF OCR completed successfully.";

      ocrProgress.style.width =
        "100%";


      setTimeout(() => {
        ocrStatus.classList.add("hidden");
      }, 800);


    } catch (error) {

      console.error(error);

      pdfText = "";
      pdfReady = false;

      alert(
        error?.message ||
        "Could not process PDF."
      );

      ocrStatus.classList.add(
        "hidden"
      );

    }

  }


  removePdfBtn.addEventListener(
    "click",
    () => {

      pdfText = "";
      pdfFileName = "";
      pdfReady = false;

      pdfInput.value = "";
      welcomePdfInput.value = "";

      pdfStatus.classList.add(
        "hidden"
      );

    }
  );


  /* =====================================================
     VOICE INPUT
     ===================================================== */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (SpeechRecognition) {

    recognition =
      new SpeechRecognition();

    recognition.continuous =
      false;

    recognition.interimResults =
      true;

    recognition.lang =
      "en-IN";


    recognition.onstart = () => {

      isListening = true;

      micBtn.classList.add(
        "bg-red-500",
        "text-white",
        "mic-listening"
      );

      micIcon.className =
        "fa-solid fa-microphone-lines";

      voiceStatus.classList.remove(
        "hidden"
      );

    };


    recognition.onresult =
      event => {

        let transcript = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          transcript +=
            event.results[i][0].transcript;

        }


        messageInput.value =
          transcript;

        voiceStatusText.textContent =
          transcript ||
          "Listening...";

      };


    recognition.onerror =
      event => {

        console.error(
          "Speech error:",
          event.error
        );

      };


    recognition.onend = () => {

      isListening = false;

      micBtn.classList.remove(
        "bg-red-500",
        "text-white",
        "mic-listening"
      );

      micIcon.className =
        "fa-solid fa-microphone";

      voiceStatus.classList.add(
        "hidden"
      );


      const spokenText =
        messageInput.value.trim();


      if (spokenText) {

        sendMessage(spokenText);

      }

    };


    micBtn.addEventListener(
      "click",
      () => {

        if (isListening) {

          recognition.stop();

        } else {

          try {
            recognition.start();
          } catch (error) {
            console.error(error);
          }

        }

      }
    );


    stopVoiceBtn.addEventListener(
      "click",
      () => {

        if (
          recognition &&
          isListening
        ) {

          recognition.stop();

        }

      }
    );


  } else {

    micBtn.addEventListener(
      "click",
      () => {

        alert(
          "Voice input is not supported in this browser. Try Chrome."
        );

      }
    );

  }


  /* =====================================================
     VOICE OUTPUT
     ===================================================== */

  function speakText(
    text,
    button = null
  ) {

    if (
      !("speechSynthesis" in window)
    ) {

      alert(
        "Voice output is not supported."
      );

      return;

    }


    window.speechSynthesis.cancel();


    const cleanText =
      text

        .replace(
          /```[\s\S]*?```/g,
          ""
        )

        .replace(
          /[*_#>`]/g,
          ""
        )

        .replace(
          /\[([^\]]+)\]\([^)]+\)/g,
          "$1"
        )

        .replace(
          /\n+/g,
          " "
        );


    const utterance =
      new SpeechSynthesisUtterance(
        cleanText
      );


    utterance.lang =
      "en-IN";

    utterance.rate =
      .95;


    if (button) {

      button.innerHTML =
        '<i class="fa-solid fa-stop mr-1"></i> Stop';

    }


    utterance.onend = () => {

      if (button) {

        button.innerHTML =
          '<i class="fa-solid fa-volume-high mr-1"></i> Listen';

      }

    };


    window.speechSynthesis.speak(
      utterance
    );

  }


  /* =====================================================
     NEW CHAT
     ===================================================== */

  newChatBtn.addEventListener(
    "click",
    () => {

      window.speechSynthesis?.cancel();


      if (
        recognition &&
        isListening
      ) {

        recognition.stop();

      }


      chatHistory = [];

      messages.innerHTML = "";


      clearImage();


      pdfText = "";
      pdfFileName = "";
      pdfReady = false;


      pdfInput.value = "";
      welcomePdfInput.value = "";


      pdfStatus.classList.add(
        "hidden"
      );

      ocrStatus.classList.add(
        "hidden"
      );


      messageInput.value = "";

      messageInput.style.height =
        "auto";


      welcomeSection.classList.remove(
        "hidden"
      );

    }
  );

</script>
