<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study-AI Chat</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
    darkMode: "class"
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Inter", sans-serif;
    transition: background .25s, color .25s;
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-thumb {
    background: #c7c7c7;
    border-radius: 20px;
}

.chat-message {
    animation: messageIn .2s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.ai-content p {
    margin: 0 0 10px;
}

.ai-content p:last-child {
    margin-bottom: 0;
}

.ai-content ul,
.ai-content ol {
    margin: 8px 0;
    padding-left: 22px;
}

.ai-content li {
    margin: 5px 0;
}

.ai-content strong {
    font-weight: 700;
}

.ai-content code {
    background: #f1f1f1;
    padding: 2px 5px;
    border-radius: 5px;
}

.dark .ai-content code {
    background: #292d33;
}

.ai-content pre {
    background: #111;
    color: white;
    padding: 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 10px 0;
}
</style>
</head>

<body class="bg-[#f8f8f8] dark:bg-[#0d0f12] text-gray-900 dark:text-gray-100 min-h-screen">

<!-- TOP BAR -->

<header class="h-14 border-b border-gray-200 dark:border-gray-800 bg-white/90 dark:bg-[#0d0f12]/90 backdrop-blur-md sticky top-0 z-50">

    <div class="max-w-4xl mx-auto h-full px-4 flex items-center justify-between">

        <div class="flex items-center gap-2">

            <div class="w-8 h-8 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center font-bold">
                S
            </div>

            <span class="font-bold">
                Study-AI
            </span>

        </div>


        <div class="flex items-center gap-2">

            <button
                onclick="clearChat()"
                class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center"
                title="New chat">

                <i class="fa-solid fa-plus text-xs"></i>

            </button>


            <button
                onclick="toggleDarkMode()"
                class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center">

                <i id="themeIcon" class="fa-regular fa-moon text-sm"></i>

            </button>

        </div>

    </div>

</header>


<!-- CHAT AREA -->

<main class="max-w-3xl mx-auto px-4 min-h-[calc(100vh-56px)] flex flex-col">

    <!-- Welcome -->

    <div
        id="welcome"
        class="flex-1 flex flex-col items-center justify-center text-center pb-32">

        <div class="w-12 h-12 rounded-2xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center mb-5 shadow-sm">

            <i class="fa-solid fa-sparkles"></i>

        </div>

        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-3">
            What do you want to learn?
        </h1>

        <p class="text-sm text-gray-500 dark:text-gray-400">
            Ask Study-AI anything about your studies.
        </p>

    </div>


    <!-- MESSAGES -->

    <div
        id="messages"
        class="flex-1 py-6 space-y-6 hidden">

    </div>


    <!-- INPUT AREA -->

    <div class="sticky bottom-0 pb-5 pt-3 bg-gradient-to-t from-[#f8f8f8] dark:from-[#0d0f12] via-[#f8f8f8] dark:via-[#0d0f12] to-transparent">

        <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 rounded-2xl shadow-sm overflow-hidden">

            <textarea
                id="userPrompt"
                rows="2"
                placeholder="Message Study-AI..."
                class="w-full px-4 pt-4 pb-2 bg-transparent outline-none resize-none text-sm placeholder-gray-400 dark:placeholder-gray-500"
                onkeydown="handleKeyDown(event)">
            </textarea>


            <div class="flex items-center justify-between px-3 pb-3 pt-1">

                <div class="flex items-center gap-2">

                    <button
                        onclick="insertMath()"
                        class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"
                        title="Math">

                        <i class="fa-solid fa-calculator text-xs"></i>

                    </button>


                    <button
                        onclick="quickQuestion('Explain this topic in simple words.')"
                        class="hidden sm:block px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs hover:bg-gray-200 dark:hover:bg-gray-700">

                        Explain

                    </button>


                    <button
                        onclick="quickQuestion('Solve this step-by-step and explain the answer.')"
                        class="hidden sm:block px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs hover:bg-gray-200 dark:hover:bg-gray-700">

                        Solve

                    </button>

                </div>


                <button
                    id="sendButton"
                    onclick="sendMessage()"
                    class="w-9 h-9 rounded-xl bg-black dark:bg-white text-white dark:text-black flex items-center justify-center hover:opacity-80 disabled:opacity-40">

                    <i class="fa-solid fa-arrow-up text-xs"></i>

                </button>

            </div>

        </div>


        <p class="text-center text-[10px] text-gray-400 mt-2">
            Study-AI can make mistakes. Check important answers.
        </p>

    </div>

</main>


<script>

/* =========================
   CHAT DATA
========================= */

let chatHistory = [];


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

    document.documentElement.classList.toggle("dark");

    localStorage.setItem(
        "theme",
        document.documentElement.classList.contains("dark")
            ? "dark"
            : "light"
    );

    updateThemeIcon();
}


function updateThemeIcon() {

    const icon =
        document.getElementById("themeIcon");

    if (
        document.documentElement.classList.contains("dark")
    ) {

        icon.className =
            "fa-regular fa-sun text-sm";

    } else {

        icon.className =
            "fa-regular fa-moon text-sm";

    }
}


if (localStorage.getItem("theme") === "dark") {

    document.documentElement.classList.add("dark");

}

updateThemeIcon();


/* =========================
   ENTER KEY
========================= */

function handleKeyDown(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   QUICK QUESTIONS
========================= */

function quickQuestion(text) {

    const input =
        document.getElementById("userPrompt");

    input.value = text;

    input.focus();

}


function insertMath() {

    const input =
        document.getElementById("userPrompt");

    input.value =
        "Solve this equation step-by-step: 2x² + 5x - 3 = 0";

    input.focus();

}


/* =========================
   ADD USER MESSAGE
========================= */

function addUserMessage(text) {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "chat-message flex justify-end";

    message.innerHTML = `

        <div class="max-w-[85%]">

            <div class="bg-black dark:bg-white text-white dark:text-black px-4 py-3 rounded-2xl rounded-br-md text-sm leading-relaxed">

                ${escapeHTML(text)}

            </div>

        </div>

    `;

    messages.appendChild(message);

    scrollToBottom();

}


/* =========================
   AI LOADING
========================= */

function addLoadingMessage() {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.id = "loadingMessage";

    message.className =
        "chat-message flex justify-start";

    message.innerHTML = `

        <div class="max-w-[90%]">

            <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 px-4 py-3 rounded-2xl rounded-bl-md shadow-sm">

                <div class="flex items-center gap-2">

                    <div class="w-6 h-6 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center text-[10px]">
                        S
                    </div>

                    <span class="text-xs font-semibold">
                        Study-AI
                    </span>

                </div>

                <div class="flex gap-1 mt-3">

                    <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce"></span>

                    <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce [animation-delay:150ms]"></span>

                    <span class="w-1.5 h-1.5 rounded-full bg-gray-400 animate-bounce [animation-delay:300ms]"></span>

                </div>

            </div>

        </div>

    `;

    messages.appendChild(message);

    scrollToBottom();

}


/* =========================
   AI RESPONSE
========================= */

function replaceLoadingMessage(text) {

    const loading =
        document.getElementById("loadingMessage");

    if (!loading) return;


    let html = marked.parse(text);


    loading.innerHTML = `

        <div class="max-w-[92%]">

            <div class="bg-white dark:bg-[#16191e] border border-gray-200 dark:border-gray-800 px-4 py-4 rounded-2xl rounded-bl-md shadow-sm">

                <div class="flex items-center gap-2 mb-3">

                    <div class="w-6 h-6 rounded-lg bg-black dark:bg-white text-white dark:text-black flex items-center justify-center text-[10px]">
                        S
                    </div>

                    <span class="text-xs font-semibold">
                        Study-AI
                    </span>

                </div>

                <div class="ai-content text-sm leading-6">
                    ${html}
                </div>

            </div>

        </div>

    `;

    scrollToBottom();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById("userPrompt");

    const text =
        input.value.trim();


    if (!text) return;


    const button =
        document.getElementById("sendButton");


    /* Show chat */

    document
        .getElementById("welcome")
        .classList.add("hidden");

    document
        .getElementById("messages")
        .classList.remove("hidden");


    /* User message */

    addUserMessage(text);

    input.value = "";


    /* Loading */

    addLoadingMessage();


    button.disabled = true;


    chatHistory.push({
        role: "user",
        parts: [
            {
                text: text
            }
        ]
    });


    try {

        /*
         * IMPORTANT:
         * This connects to your existing Vercel backend.
         * Your Gemini API key stays on Vercel.
         */

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: text
                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI request failed"
            );

        }


        const answer =
            data.answer ||
            "Sorry, I couldn't generate an answer.";


        chatHistory.push({
            role: "model",
            parts: [
                {
                    text: answer
                }
            ]
        });


        replaceLoadingMessage(answer);


    } catch (error) {

        console.error(error);


        replaceLoadingMessage(
            "⚠️ Sorry, I couldn't connect to Study-AI. Please try again."
        );

    } finally {

        button.disabled = false;

        input.focus();

    }

}


/* =========================
   CLEAR CHAT
========================= */

function clearChat() {

    chatHistory = [];

    document.getElementById(
        "messages"
    ).innerHTML = "";

    document.getElementById(
        "messages"
    ).classList.add("hidden");

    document.getElementById(
        "welcome"
    ).classList.remove("hidden");

    document.getElementById(
        "userPrompt"
    ).value = "";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
